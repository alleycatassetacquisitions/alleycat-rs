[package]
name = "alleycat-rs"
version = "0.1.0"
edition = "2024"
authors = ["Zach Koch <ezekeal@gmail.com>"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "alleycat-rs"
path = "src/main.rs"

[dependencies]
config = "0.14"
actix-web = "4"
tokio = { version= "1", features = ["macros", "rt-multi-thread"] }
reqwest = "0.13"
serde = { version= "1", features = ["derive"]}
uuid = { version= "1", features = ["v4"] }
chrono = { version= "0.4.22", default-features = false, features = ["clock"] }
env_logger= "0.9"
log= "0.4"

[dependencies.sqlx]
version= "0.8"
default-features = false
features = [
    "runtime-tokio-rustls",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate"
]
