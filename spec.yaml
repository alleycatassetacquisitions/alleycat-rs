name: alleycat
region: sfo
services:
  - name: alleycat
    dockerfile_path: Dockerfile
    source_dir: .
    github:
      branch: main
      deploy_on_push: true
      repo: alleycatassetacquisitions/alleycat-rs
    health_check:
      http_path: /health_check
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: APP_DATABASE__USERNAME
        scope: RUN_TIME
        value: ${alleycat-db.USERNAME}
      - key: APP_DATABASE__PASSWORD
        scope: RUN_TIME
        value: ${alleycat-db.PASSWORD}
      - key: APP_DATABASE__HOST
        scope: RUN_TIME
        value: ${alleycat-db.HOSTNAME}
      - key: APP_DATABASE__PORT
        scope: RUN_TIME
        value: ${alleycat-db.PORT}
      - key: APP_DATABASE__DATABASE_NAME
        scope: RUN_TIME
        value: ${alleycat-db.DATABASE}
databases:
  - engine: PG
    name: alleycat-db
    num_nodes: 1
    size: db-s-dev-database
    version: "18"
