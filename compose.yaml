name: alleycat-rs

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENVIRONMENT: production
      APP_DATABASE__HOST: postgres
      APP_DATABASE__PORT: 5432
      APP_DATABASE__USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      APP_DATABASE__PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DATABASE__DATABASE_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      APP_DATABASE__REQUIRE_SSL: false
      RUST_LOG: info
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres-data:
